<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-labelledby="t d">
  <title id="t">KIAO - Prism Mind</title>
  <desc id="d">The K opens like a prism: one mind goes in, a spectrum of agents comes out, each beam landing on its own agent at the rim.</desc>
  <!-- KIAO palette. Derive a product icon by overriding these on the <svg>. -->
  <style>
    svg{
      --k-bg:#020411;       /* canvas, taken from the 2025 Brain-K icon      */
      --k-lift:#16204A;     /* canvas glow                                   */
      --k-gold:#F2B654;     /* KIAO family gold - never change per product   */
      --k-gold-lt:#FFE2A8;
      --k-gold-dk:#8A5A16;
      --k-human:#FF4F87;    /* the human side of the pair                    */
      --k-ai:#22D3EE;       /* the agent side of the pair                    */
      --k-accent:#7C5CFF;   /* first beam - the slot carries the product     */
      --k-mint:#3DDC97;
      --k-spark:#FFFFFF;    /* where human and agent meet                    */
    }
    /* gradient stops follow the same variables, so one override recolours
       the whole mark and not just its flat parts */
    .s-gold{stop-color:var(--k-gold,#F2B654)}
    .s-goldl{stop-color:var(--k-gold-lt,#FFE2A8)}
    .s-human{stop-color:var(--k-human,#FF4F87)}
    .s-ai{stop-color:var(--k-ai,#22D3EE)}
    .s-accent{stop-color:var(--k-accent,#7C5CFF)}
    .s-lift,.s-lift0{stop-color:var(--k-lift,#16204A)}
    .s-spark,.s-spark0{stop-color:var(--k-spark,#FFFFFF)}
    .bg{fill:var(--k-bg,#020411)}
    .ring{fill:none;stroke:var(--k-gold,#F2B654);stroke-width:8}
    .brain-out{stroke:var(--k-gold,#F2B654);stroke-width:5.5;stroke-linecap:round}
    .brain-in{stroke:var(--k-gold,#F2B654);stroke-width:3.4;stroke-linecap:round}
    .k{stroke:var(--k-gold,#F2B654)}
    .spark{fill:var(--k-spark,#FFFFFF)}
    .seat{fill:var(--k-bg,#020411)}
    .b-violet,.t-violet{fill:var(--k-accent,#7C5CFF)}
    .b-ai,.t-ai{fill:var(--k-ai,#22D3EE)}
    .b-mint,.t-mint{fill:var(--k-mint,#3DDC97)}
    .b-goldl,.t-goldl{fill:var(--k-gold-lt,#FFE2A8)}
    .b-human,.t-human{fill:var(--k-human,#FF4F87)}
  </style>
  <defs>
    <radialGradient id="lift" cx="34%" cy="24%" r="78%">
      <stop offset="0" class="s-lift" stop-color="#16204A" stop-opacity=".85"/>
      <stop offset="1" class="s-lift0" stop-color="#16204A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="128" cy="128" r="82"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".55"/>
    </linearGradient>
    <mask id="beamFade">
      <rect x="130" y="40" width="86" height="176" fill="url(#fade)"/>
    </mask>
  </defs>

  <!-- canvas -->
  <g id="canvas">
    <rect class="bg" width="256" height="256" rx="48" fill="#020411"/>
    <rect width="256" height="256" rx="48" fill="url(#lift)"/>
  </g>

  <circle class="ring" cx="128" cy="128" r="86"/>

  <!-- the mind the light goes into -->

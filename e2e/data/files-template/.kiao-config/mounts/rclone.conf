# Local FUSE remote tests mounting, unmounting, vanished mounts and unresponsive mounts
# through the same rclone process and kernel mount machinery as Drive, without Google auth.
# Models an externally configured remote: worker preserves sections it did not create,
# so the panel can mount existing remotes without Google reauthorization.
# rclone runs from the store root: e2e-local:some/folder stays store-relative if the store moves.
[e2e-local]
type = local

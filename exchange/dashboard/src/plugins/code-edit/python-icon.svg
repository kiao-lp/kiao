<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .py-glyph { fill: #38BDF8; }
    @media (prefers-color-scheme: light) {
      .py-glyph { fill: #0369A1; }
    }
  </style>

  <!-- The language's own two letters, as for the other source kinds: at 16px a mark reads
       where a pictogram — here two interlocking snakes — does not -->
  <text class="py-glyph" x="12" y="17" text-anchor="middle"
        font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="bold">PY</text>
</svg>

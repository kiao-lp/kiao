<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box-1 { fill: #60A5FA; stroke: #60A5FA; }
    .box-2 { fill: #A78BFA; stroke: #A78BFA; }
    .box-3 { fill: #22D3EE; stroke: #22D3EE; }
    .box-4 { fill: #F472B6; stroke: #F472B6; }
    .connection { stroke: #9CA3AF; }
    @media (prefers-color-scheme: light) {
      .box-1 { fill: #2563EB; stroke: #2563EB; }
      .box-2 { fill: #7C3AED; stroke: #7C3AED; }
      .box-3 { fill: #0891B2; stroke: #0891B2; }
      .box-4 { fill: #DB2777; stroke: #DB2777; }
      .connection { stroke: #6B7280; }
    }
  </style>
  
  <!-- Connection lines -->
  <line class="connection" x1="7" y1="7" x2="11" y2="11" stroke-width="2" stroke-linecap="round"/>
  <line class="connection" x1="13" y1="12" x2="18" y2="12" stroke-width="2" stroke-linecap="round"/>
  <line class="connection" x1="7" y1="18" x2="11" y2="14" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Node boxes -->
  <rect class="box-1" x="2" y="2" width="5" height="5" rx="1" stroke-width="0"/>
  <rect class="box-2" x="9" y="9" width="5" height="5" rx="1" stroke-width="0"/>
  <rect class="box-3" x="17" y="9" width="5" height="5" rx="1" stroke-width="0"/>
  <rect class="box-4" x="2" y="17" width="5" height="5" rx="1" stroke-width="0"/>
</svg>

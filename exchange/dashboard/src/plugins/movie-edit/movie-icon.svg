<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .movie-frame { stroke: #60A5FA; }
    .movie-play { fill: #F472B6; }
    .movie-hole { fill: #60A5FA; }
    @media (prefers-color-scheme: light) {
      .movie-frame { stroke: #2563EB; }
      .movie-play { fill: #DB2777; }
      .movie-hole { fill: #2563EB; }
    }
  </style>
  
  <!-- Film strip frame -->
  <rect class="movie-frame" x="2" y="4" width="20" height="16" rx="2" stroke-width="2"/>
  
  <!-- Film holes top -->
  <rect class="movie-hole" x="5" y="5" width="2" height="2" rx="0.5"/>
  <rect class="movie-hole" x="11" y="5" width="2" height="2" rx="0.5"/>
  <rect class="movie-hole" x="17" y="5" width="2" height="2" rx="0.5"/>
  
  <!-- Film holes bottom -->
  <rect class="movie-hole" x="5" y="17" width="2" height="2" rx="0.5"/>
  <rect class="movie-hole" x="11" y="17" width="2" height="2" rx="0.5"/>
  <rect class="movie-hole" x="17" y="17" width="2" height="2" rx="0.5"/>
  
  <!-- Play button -->
  <path class="movie-play" d="M10 9L16 12L10 15V9Z"/>
</svg>

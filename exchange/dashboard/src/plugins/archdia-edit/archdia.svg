<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box-1 { fill: #60A5FA; }
    .box-2 { fill: #A78BFA; }
    .box-3 { fill: #22D3EE; }
    .box-4 { fill: #F472B6; }
    .connection { stroke: #9CA3AF; }
    @media (prefers-color-scheme: light) {
      .box-1 { fill: #2563EB; }
      .box-2 { fill: #7C3AED; }
      .box-3 { fill: #0891B2; }
      .box-4 { fill: #DB2777; }
      .connection { stroke: #6B7280; }
    }
  </style>
  
  <!-- Connection lines -->
  <line class="connection" x1="11" y1="6.5" x2="13" y2="6.5" stroke-width="2" stroke-linecap="round"/>
  <line class="connection" x1="7.5" y1="9" x2="7.5" y2="12" stroke-width="2" stroke-linecap="round"/>
  <line class="connection" x1="16.5" y1="9" x2="16.5" y2="12" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Node boxes -->
  <rect class="box-1" x="4" y="4" width="7" height="5" rx="1" stroke-width="0"/>
  <rect class="box-2" x="13" y="4" width="7" height="5" rx="1" stroke-width="0"/>
  <rect class="box-3" x="4" y="12" width="7" height="5" rx="1" stroke-width="0"/>
  <rect class="box-4" x="13" y="12" width="7" height="5" rx="1" stroke-width="0"/>
</svg>
